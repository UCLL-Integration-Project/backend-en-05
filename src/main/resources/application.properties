spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Use default naming strategy which handles underscores correctly
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# MQTT Configuration
mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}

app.deduplication.window-seconds=5

# Auth0 JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-pt13ynuua1vt84mg.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://dev-pt13ynuua1vt84mg.eu.auth0.com/api/v2/
