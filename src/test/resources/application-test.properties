spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable real MQTT for tests by default, will be mocked or use local broker if needed
mqtt.enabled=true
mqtt.broker.url=tcp://localhost:1883

app.deduplication.window-seconds=5

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-pt13ynuua1vt84mg.eu.auth0.com/
