name: Backend Production Rollback

on:
  workflow_dispatch:
    inputs:
      version_to_rollback_to:
        description: 'Enter the backend version tag to rollback'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback-production:
    runs-on: [self-hosted, matg-laptop]
    permissions:
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull older stable image
        run: |
          $IMAGE_LOWER = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}".ToLower()
          docker pull "$IMAGE_LOWER:${{ inputs.version_to_rollback_to }}"
          echo "IMAGE_LOWER=$IMAGE_LOWER" >> $env:GITHUB_ENV
        shell: powershell

      - name: Re-tag as Production and Push
        run: |
          docker tag "$env:IMAGE_LOWER:${{ inputs.version_to_rollback_to }}" "$env:IMAGE_LOWER:prod"
          docker push "$env:IMAGE_LOWER:prod"
        shell: powershell

      - name: Rollback Success Message
        run: echo "Successfully rolled back Backend Production to version ${{ inputs.version_to_rollback_to }}"