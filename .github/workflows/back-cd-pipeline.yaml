name: Backend CD Pipeline

on:
  workflow_run:
    workflows: ["Backend CI Pipeline"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # deploy the staging, runs only on "main" branch
  deploy-to-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Image Name to Lowercase
        run: |
          echo "IMAGE_LOWER=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Staging Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:staging
            ${{ env.IMAGE_LOWER }}:${{ github.event.workflow_run.head_sha }}
          provenance: false

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: itip-en-05

      - name: Deploy to OpenShift
        run: |
          # Update the deployment manifest with the specific image SHA to ensure a rolling update
          sed -i "s|image: .*|image: ${{ env.IMAGE_LOWER }}:${{ github.event.workflow_run.head_sha }}|g" k8s/backend/deployment.yaml

          oc apply -f k8s/backend/imagestream.yaml
          # Force OKD to import the image from GHCR immediately
          oc import-image backend-en-05:staging --from=${{ env.IMAGE_LOWER }}:staging --confirm
          
          oc apply -f k8s/backend/service.yaml
          oc apply -f k8s/backend/deployment.yaml
          oc apply -f k8s/backend/route.yaml

          # Wait for the rollout to complete
          oc rollout status deployment/backend-en-05 -n itip-en-05 --timeout=10m

      - name: Smoke Test
        id: smoke-test
        run: |
          ROUTE_HOST=$(oc get route backend-en-05 -n itip-en-05 -o jsonpath='{.spec.host}')
          HEALTH_URL="https://${ROUTE_HOST}/v1/health"
          TIMEOUT=30
          START_TIME=$(date +%s)
          SUCCESS=false

          echo "Running smoke test against: ${HEALTH_URL}"
          while [ $(( $(date +%s) - START_TIME )) -lt $TIMEOUT ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${HEALTH_URL}" 2>/dev/null || echo "000")
            echo "Health check status: ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            sleep 2
          done

          echo "## Smoke Test Result (Staging)" >> $GITHUB_STEP_SUMMARY
          echo "**Endpoint:** \`${HEALTH_URL}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$SUCCESS" = "true" ]; then
            echo "**Result:** PASSED - \`GET /v1/health\` returned 200 OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** FAILED - \`GET /v1/health\` did not return 200 within ${TIMEOUT} seconds" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Automatic Rollback on Failed Smoke Test
        if: failure() && steps.smoke-test.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back staging deployment"
          oc rollout undo deployment/backend-en-05 -n itip-en-05
          oc rollout status deployment/backend-en-05 -n itip-en-05 --timeout=5m

          echo "## Automatic Rollback (Staging)" >> $GITHUB_STEP_SUMMARY
          echo "Smoke test failed. Deployment has been automatically rolled back to the previous revision." >> $GITHUB_STEP_SUMMARY

  # deploy to the production, runs only on release tags
  deploy-to-production:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Image Name to Lowercase
        run: |
          echo "IMAGE_LOWER=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:prod
            ${{ env.IMAGE_LOWER }}:${{ github.event.workflow_run.head_branch }}
          provenance: false

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: itip-en-05

      - name: Deploy to OpenShift
        run: |
          # Update the deployment manifest with the production tag
          sed -i "s|image: .*|image: ${{ env.IMAGE_LOWER }}:${{ github.event.workflow_run.head_branch }}|g" k8s/backend/deployment.yaml

          oc apply -f k8s/backend/imagestream.yaml
          # Force OKD to import the image from GHCR immediately
          oc import-image backend-en-05:prod --from=${{ env.IMAGE_LOWER }}:prod --confirm
          
          oc apply -f k8s/backend/service.yaml
          oc apply -f k8s/backend/deployment.yaml
          oc apply -f k8s/backend/route.yaml

          # Wait for the rollout to complete
          oc rollout status deployment/backend-en-05 -n itip-en-05 --timeout=10m

      - name: Smoke Test
        id: smoke-test
        run: |
          ROUTE_HOST=$(oc get route backend-en-05 -n itip-en-05 -o jsonpath='{.spec.host}')
          HEALTH_URL="https://${ROUTE_HOST}/v1/health"
          TIMEOUT=30
          START_TIME=$(date +%s)
          SUCCESS=false

          echo "Running smoke test against: ${HEALTH_URL}"
          while [ $(( $(date +%s) - START_TIME )) -lt $TIMEOUT ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${HEALTH_URL}" 2>/dev/null || echo "000")
            echo "Health check status: ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              break
            fi
            sleep 2
          done

          echo "## Smoke Test Result (Production)" >> $GITHUB_STEP_SUMMARY
          echo "**Endpoint:** \`${HEALTH_URL}\`" >> $GITHUB_STEP_SUMMARY
          if [ "$SUCCESS" = "true" ]; then
            echo "**Result:** PASSED - \`GET /v1/health\` returned 200 OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** FAILED - \`GET /v1/health\` did not return 200 within ${TIMEOUT} seconds" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Automatic Rollback on Failed Smoke Test
        if: failure() && steps.smoke-test.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back production deployment"
          oc rollout undo deployment/backend-en-05 -n itip-en-05
          oc rollout status deployment/backend-en-05 -n itip-en-05 --timeout=5m

          echo "## Automatic Rollback (Production)" >> $GITHUB_STEP_SUMMARY
          echo "Smoke test failed. Deployment has been automatically rolled back to the previous revision." >> $GITHUB_STEP_SUMMARY
