name: Backend CD Pipeline

on:
  workflow_run:
    workflows: ["Backend CI Pipeline"]
    types:
      - completed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # deploy the staging, runs only on "main" branch
  deploy-to-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, matg-laptop]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Image Name to Lowercase
        run: |
          $IMAGE_LOWER = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}".ToLower()
          echo "IMAGE_LOWER=$IMAGE_LOWER" >> $env:GITHUB_ENV
        shell: powershell

      - name: Build and push Staging Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:staging
            ${{ env.IMAGE_LOWER }}:${{ github.event.workflow_run.head_sha }}
          provenance: false

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: itip-en-05

      - name: Deploy to OpenShift
        run: |
          # Update the deployment manifest with the specific image SHA to ensure a rolling update
          $content = Get-Content k8s/backend/deployment.yaml
          $content -replace 'image: .*', "image: $($env:IMAGE_LOWER):${{ github.event.workflow_run.head_sha }}" | Set-Content k8s/backend/deployment.yaml
          
          oc apply -f k8s/backend/imagestream.yaml
          # Force OKD to import the image from GHCR immediately
          oc import-image backend-en-05:staging --from="$($env:IMAGE_LOWER):staging" --confirm
          
          oc apply -f k8s/backend/service.yaml
          oc apply -f k8s/backend/deployment.yaml
          oc apply -f k8s/backend/route.yaml

          # Apply backup configurations
          oc apply -f k8s/backup/pvc.yaml
          oc apply -f k8s/backup/configmap.yaml
          oc apply -f k8s/backup/cronjob.yaml
          
          # Wait for the rollout to complete
          oc rollout status deployment/backend-en-05 -n itip-en-05 --timeout=10m
        shell: powershell

      - name: Smoke Test
        id: smoke-test
        run: |
          $ROUTE_HOST = oc get route backend-en-05 -n itip-en-05 -o jsonpath='{.spec.host}'
          $HEALTH_URL = "https://$ROUTE_HOST/v1/health"
          $TIMEOUT = 30
          $START_TIME = [DateTimeOffset]::Now.ToUnixTimeSeconds()
          $SUCCESS = $false

          Write-Host "Running smoke test against: $HEALTH_URL"
          while (([DateTimeOffset]::Now.ToUnixTimeSeconds() - $START_TIME) -lt $TIMEOUT) {
            try {
              $response = Invoke-WebRequest -Uri $HEALTH_URL -UseBasicParsing -TimeoutSec 5
              $HTTP_STATUS = [int]$response.StatusCode
            } catch {
              if ($_.Exception.Response) {
                $HTTP_STATUS = [int]$_.Exception.Response.StatusCode
              } else {
                $HTTP_STATUS = 0
              }
            }
            Write-Host "Health check status: $HTTP_STATUS"
            if ($HTTP_STATUS -eq 200) {
              $SUCCESS = $true
              break
            }
            Start-Sleep -Seconds 2
          }

          "## Smoke Test Result (Staging)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "**Endpoint:** ``$HEALTH_URL``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($SUCCESS) {
            "**Result:** PASSED - ``GET /v1/health`` returned 200 OK" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "**Result:** FAILED - ``GET /v1/health`` did not return 200 within $TIMEOUT seconds" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
        shell: powershell

      - name: Automatic Rollback on Failed Smoke Test
        if: failure() && steps.smoke-test.outcome == 'failure'
        run: |
          Write-Host "Smoke test failed — rolling back staging deployment"
          oc rollout undo deployment/backend-en-05 -n itip-en-05
          oc rollout status deployment/backend-en-05 -n itip-en-05 --timeout=5m

          "## Automatic Rollback (Staging)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Smoke test failed. Deployment has been automatically rolled back to the previous revision." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        shell: powershell

  # deploy to the production, runs only on release tags
  deploy-to-production:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: [self-hosted, matg-laptop]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Image Name to Lowercase
        run: |
          $IMAGE_LOWER = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}".ToLower()
          echo "IMAGE_LOWER=$IMAGE_LOWER" >> $env:GITHUB_ENV
        shell: powershell

      - name: Build and push Production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:prod
            ${{ env.IMAGE_LOWER }}:${{ github.event.workflow_run.head_branch }}
          provenance: false

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: itip-en-05

      - name: Deploy to OpenShift
        run: |
          # Update the deployment manifest with the production tag
          $content = Get-Content k8s/backend/deployment.yaml
          $content -replace 'image: .*', "image: $($env:IMAGE_LOWER):${{ github.event.workflow_run.head_branch }}" | Set-Content k8s/backend/deployment.yaml
          
          oc apply -f k8s/backend/imagestream.yaml
          # Force OKD to import the image from GHCR immediately
          oc import-image backend-en-05:prod --from="$($env:IMAGE_LOWER):prod" --confirm
          
          oc apply -f k8s/backend/service.yaml
          oc apply -f k8s/backend/deployment.yaml
          oc apply -f k8s/backend/route.yaml
          
          # Wait for the rollout to complete
          oc rollout status deployment/backend-en-05 -n itip-en-05 --timeout=10m
        shell: powershell
